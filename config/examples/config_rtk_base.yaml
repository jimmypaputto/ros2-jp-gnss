node_id: "rtk_base"
measurement_rate_hz: 5
save_to_flash: false
publish_standard_topics: false  # leave /gps/* to the rover
dynamic_model: 2

timepulse:
  active: true
  fixed_pulse:
    frequency: 1
    pulse_width: 0.1
  polarity: rising

rtk:
  mode: base
  base:
    type: survey_in
    min_observation_time_s: 180
    required_accuracy_m: 50.0
    corrections: full     # "full" (MSM7) or "tiny" (MSM4)
  # Also send the corrections to an NTRIP caster:
  # ntrip:
  #   host: caster.example.com   # required
  #   port: 2101
  #   mountpoint: MOUNT          # required
  #   username: user
  #   password: pass
