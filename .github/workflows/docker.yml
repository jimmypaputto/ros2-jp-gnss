name: Docker image

# Builds docker/Dockerfile for Raspberry Pi (arm64) and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/jp-gnss-hat:jazzy             latest master
#   ghcr.io/<owner>/jp-gnss-hat:jazzy-<sha>       a specific commit
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    # Native arm64 runner: no QEMU emulation, the build takes minutes instead of hours.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jp-gnss-hat
          flavor: latest=false
          tags: |
            type=raw,value=jazzy,enable={{is_default_branch}}
            type=sha,prefix=jazzy-,format=short

      # Pull requests only check that the image builds; nothing is pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
