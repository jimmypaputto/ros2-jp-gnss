# Shared by both services: one image, host network (visible to ROS 2 on the LAN like a
# native process), domain ID from the host, clean stop on SIGINT.
x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  # Prebuilt by .github/workflows/docker.yml and pulled when missing;
  # `docker compose build` builds it locally from this checkout instead.
  image: ghcr.io/jimmypaputto/jp-gnss-hat:jazzy
  restart: unless-stopped
  network_mode: host
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  stop_signal: SIGINT
  stop_grace_period: 15s

services:
  # The ROS 2 node.
  gnss:
    <<: *common
    # The HAT uses SPI, UART and GPIO, and which of them depends on the HAT variant
    # and Pi model. Passing the host /dev covers every variant;
    # privileged grants access to the devices and to /proc/device-tree (HAT detection).
    privileged: true
    volumes:
      - /dev:/dev
      # Directory, not a single file: set_config with save_to_yaml replaces the file.
      - type: bind
        source: ./config
        target: /config
        bind:
          create_host_path: false
    command: ["ros2", "launch", "jp_gnss_hat", "gnss.launch.py",
              "config_file:=/config/gnss_config.yaml"]

  # Web visualization on http://<pi>:5000, fed by the node's ROS 2 topics (no hardware access).
  # Reads node_id from the same config. Disable with: docker compose up -d gnss
  visualization:
    <<: *common
    volumes:
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind:
          create_host_path: false
    command: ["jp-gnss-visualization"]
